<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Countdowns</title>
  <link rel="icon" href="../favicon.ico">
  <script src="countdowns.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <ul>
    <li>
      <span>
        <div class="counter_wrapper">
          <h1 class="counter_title">40s</h1>
          <div class="counter_part">
            <div class="unit_value" id="dd1">00</div>
            <div class="unit_name">DAYS</div>
          </div>
          <div class="counter_part">
            <div class="unit_value">:</div>
            <div class="unit_name">&nbsp;</div>
          </div>
          <div class="counter_part">
            <div class="unit_value" id="hh1">00</div>
            <div class="unit_name">HOURS</div>
          </div>
          <div class="counter_part">
            <div class="unit_value">:</div>
            <div class="unit_name">&nbsp;</div>
          </div>
          <div class="counter_part">
            <div class="unit_value" id="mm1">00</div>
            <div class="unit_name">MINUTES</div>
          </div>
          <div class="counter_part">
            <div class="unit_value">:</div>
            <div class="unit_name">&nbsp;</div>
          </div>
          <div class="counter_part">
            <div class="unit_value" id="ss1">00</div>
            <div class="unit_name">SECONDS</div>
          </div>
        </div>
      </span>
    </li>
    <li>
      <span>
        <div class="counter_wrapper">
          <h1 class="counter_title">80s</h1>
          <div class="counter_part">
            <div class="unit_value" id="dd2">00</div>
            <div class="unit_name">DAYS</div>
          </div>
          <div class="counter_part">
            <div class="unit_value">:</div>
            <div class="unit_name">&nbsp;</div>
          </div>
          <div class="counter_part">
            <div class="unit_value" id="hh2">00</div>
            <div class="unit_name">HOURS</div>
          </div>
          <div class="counter_part">
            <div class="unit_value">:</div>
            <div class="unit_name">&nbsp;</div>
          </div>
          <div class="counter_part">
            <div class="unit_value" id="mm2">00</div>
            <div class="unit_name">MINUTES</div>
          </div>
          <div class="counter_part">
            <div class="unit_value">:</div>
            <div class="unit_name">&nbsp;</div>
          </div>
          <div class="counter_part">
            <div class="unit_value" id="ss2">00</div>
            <div class="unit_name">SECONDS</div>
          </div>
        </div>
      </span>
    </li>
  </ul>
</body>

</html>
